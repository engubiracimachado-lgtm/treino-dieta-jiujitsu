<body>
<title>Treino, Dieta e Jiujitsu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: coluna única de caderno de treino; faixa da semana no topo, o dia escolhido embaixo. */
:root{
  --bg:#eceff4; --surface:#ffffff; --sunk:#e2e7ee; --ink:#121925; --muted:#586374; --line:#d3d9e3;
  --accent:#1f4fd0; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --good:#1c7c45; --good-soft:#dff3e6; --warn:#96610a; --warn-soft:#fbefd2; --bad:#b3302f; --bad-soft:#fbe3e1;
  --pl-green:#2f9e5b; --pl-yellow:#e2b01f; --pl-blue:#2457d6; --pl-red:#d23b3b; --pl-yellow-ink:#2b2205;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#171f2b; --sunk:#111823; --ink:#e7ecf4; --muted:#95a1b4; --line:#293444;
  --accent:#7398ff; --accent-ink:#0a1120; --accent-soft:#1c2a4a;
  --good:#5fd08d; --good-soft:#143524; --warn:#f0c15a; --warn-soft:#3a2d0e; --bad:#ff8a84; --bad-soft:#431b1a;
  --pl-green:#3bb06a; --pl-yellow:#e8ba2c; --pl-blue:#4a78f0; --pl-red:#e05252; --pl-yellow-ink:#2b2205;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#171f2b; --sunk:#111823; --ink:#e7ecf4; --muted:#95a1b4; --line:#293444;
  --accent:#7398ff; --accent-ink:#0a1120; --accent-soft:#1c2a4a;
  --good:#5fd08d; --good-soft:#143524; --warn:#f0c15a; --warn-soft:#3a2d0e; --bad:#ff8a84; --bad-soft:#431b1a;
  --pl-green:#3bb06a; --pl-yellow:#e8ba2c; --pl-blue:#4a78f0; --pl-red:#e05252; --pl-yellow-ink:#2b2205;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 56px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.area{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;min-height:220px}
.area:hover{border-color:var(--accent)}
.area-t{font-family:var(--display);font-weight:700;font-size:46px;overflow-wrap:anywhere;line-height:.9;text-transform:uppercase;letter-spacing:.01em}
.area-s{color:var(--muted);font-size:15px;flex:1}
.area-h{font-size:15px;font-weight:500;border-top:1px solid var(--line);padding-top:10px;width:100%}
.area-h b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
@media (max-width:560px){.areas{grid-template-columns:1fr}.area{min-height:0}.area-t{font-size:48px}}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--good)} .status.saving i{background:var(--warn)} .status.err i{background:var(--bad)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:var(--r)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;min-width:0;border-radius:7px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{display:flex;flex-direction:column;gap:20px;padding-top:18px}
.week{display:flex;align-items:stretch;gap:6px}
.week .nav{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:36px;font-size:20px;color:var(--muted);flex:none}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.day .a{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.day .n{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.day .m{font-size:12px;line-height:1.2;height:15px;font-weight:600;color:var(--muted)}
.day.today .a{color:var(--accent)}
.day.done .m{color:var(--good)} .day.going .m{color:var(--warn)} .day.rest{background:transparent}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.eyebrow{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.head{display:flex;flex-direction:column;gap:4px}
.head h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0;text-wrap:balance;text-transform:uppercase}
.head .sub{color:var(--muted);font-size:15px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:3px}

.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.ex.s-ok{border-left:4px solid var(--good)} .ex.s-parcial{border-left:4px solid var(--warn)} .ex.s-nao{border-left:4px solid var(--bad)}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ex-h h3{font-size:18px;font-weight:600;margin:0;min-width:0;overflow-wrap:anywhere}
.ord{font-family:var(--display);font-weight:700;font-size:15px;line-height:26px;width:26px;height:26px;text-align:center;border-radius:50%;background:var(--sunk);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.ex-h h3{flex:1}
.nota{margin:0;background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.nota b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.det{display:block;color:var(--muted);font-size:13px;white-space:pre-line}
textarea.mini{min-height:44px}
.prow .full{grid-column:1/-1}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px minmax(0,1fr) 76px 76px 44px;gap:6px;align-items:center}
.pset{display:grid;grid-template-columns:30px 1fr 1fr 34px;gap:6px;align-items:center;max-width:420px}
.hd span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sn{font-family:var(--display);font-weight:700;font-size:19px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sp{font-variant-numeric:tabular-nums;font-weight:500;overflow-wrap:anywhere}
.set.on .sn{color:var(--good)}
.ck{height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:18px;color:var(--muted)}
.ck[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.btn.sm{padding:6px 12px;font-size:14px}
.x[disabled]{opacity:.3;cursor:default}
.pex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pex-h{display:flex;gap:4px;align-items:flex-end}
.pex-h .f{flex:1}
.pex-h .ord{margin-bottom:8px}
.plan{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.03em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 4px;font-weight:500;font-size:15px}
.seg button[aria-pressed="true"].ok{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.seg button[aria-pressed="true"].parcial{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.seg button[aria-pressed="true"].nao{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.row{display:grid;grid-template-columns:110px 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=time],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.num{font-variant-numeric:tabular-nums}
.chip{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:18px}
.blk{display:flex;flex-direction:column;gap:8px}
.timer{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 0;font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.rpe button[aria-pressed="true"]{color:#fff;border-color:transparent}
.rpe button[aria-pressed="true"].b1{background:var(--pl-green)} .rpe button[aria-pressed="true"].b2{background:var(--pl-yellow);color:var(--pl-yellow-ink)}
.rpe button[aria-pressed="true"].b3{background:var(--pl-blue)} .rpe button[aria-pressed="true"].b4{background:var(--pl-red)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rpe.sm{grid-template-columns:repeat(10,1fr);gap:3px}
.rpe.sm button{padding:6px 0;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.hbar{display:block;height:4px;background:var(--sunk);border-radius:2px;margin-top:3px;min-width:60px}
.hbar b{display:block;height:100%;background:var(--accent);border-radius:2px}
.seg button.per[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.fb{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:10px;padding:12px 14px}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:9px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--sunk)}
.sug{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rpe.n5{grid-template-columns:repeat(5,1fr)}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it-t{overflow-wrap:anywhere}
.it.off .it-t{color:var(--muted);text-decoration:line-through}
.ck2{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:500;white-space:nowrap}
.ck2.ok[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.ck2.nao[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.row3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.btn.per[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hr{font-weight:500;color:var(--muted);font-size:14px}
.stat .hbar{margin-top:6px}
.reg{display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:var(--good-soft);border-radius:8px;padding:10px 12px}
.reg b{font-variant-numeric:tabular-nums}
#jtabs{overflow-x:auto;scrollbar-width:thin}
#jtabs button{flex:none;padding-inline:14px;white-space:nowrap}
.belt{height:34px;border-radius:5px;border:1px solid var(--line);display:flex;justify-content:flex-end;align-items:stretch;padding-right:26px;max-width:420px;width:100%}
.belt .tip{width:96px;background:#15161a;display:flex;gap:7px;align-items:stretch;justify-content:center;padding:0 10px}
.belt .tip.red{background:#c0262d}
.belt .tip i{width:8px;background:#f5f5f2;display:block}
.belt.none{justify-content:center;align-items:center;padding:0;background:var(--sunk);color:var(--muted);font-size:14px}
.det2{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere;white-space:pre-line}
.row3b{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.five{grid-template-columns:repeat(5,1fr)}
.seg.five button{padding-inline:2px;font-size:14px}
input[type=date]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
@media (max-width:420px){.row3b{grid-template-columns:1fr 1fr}.row3b .f:first-child{grid-column:1/-1}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.login-box h2{font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;margin:0;line-height:1}
input[type=email],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 10px;font-size:16px}
.hint{font-size:14px;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600}
a.btn{text-decoration:none;display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:13px 16px;font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:8px;border-radius:8px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:52ch}

.pday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.pday-h{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:end}
.pday-h b{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.5}
.prow{display:grid;grid-template-columns:1fr 62px 78px 78px 34px;gap:6px;align-items:end;padding-top:10px;border-top:1px solid var(--line)}
@media (max-width:560px){ .prow{grid-template-columns:1fr 1fr 1fr 34px} .prow .f.name{grid-column:1/-1} .head h2{font-size:32px} .rpe{grid-template-columns:repeat(5,1fr)} }

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.w{white-space:normal;min-width:140px}
.up{color:var(--good);font-weight:600} .down{color:var(--bad);font-weight:600}
section{display:flex;flex-direction:column;gap:10px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="marca"><button class="btn sm" id="voltar" data-act="area" data-a="home" hidden>‹ Início</button><h1 id="marca">Treino, Dieta e Jiujitsu</h1></div>
      <div class="status" id="status" role="status"><i></i><span>Conectando…</span></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" data-act="tab" data-t="hoje">Treino</button>
      <button role="tab" data-act="tab" data-t="plano">Plano</button>
      <button role="tab" data-act="tab" data-t="hist">Histórico</button>
      <button role="tab" data-act="tab" data-t="perfil">Perfil</button>
    </nav>
    <nav class="tabs" role="tablist" id="dtabs" hidden>
      <button role="tab" data-act="d-tab" data-t="dia">Diário</button>
      <button role="tab" data-act="d-tab" data-t="plano">Plano</button>
      <button role="tab" data-act="d-tab" data-t="hist">Histórico</button>

      <button role="tab" data-act="j-tab" data-t="estudo">Estudo</button>

<script>

var R_DIA=/^(segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:\s*-?\s*feira)?/i;

/* Tira do texto as listas por série (pares "12 (30 kg), 10 (35 kg)" ou cargas "40/45/50 kg") e guarda em L. */

function dRefTxt(k,p){var a=[];if(k!=null)a.push("~"+Math.round(k).toLocaleString("pt-BR")+" kcal");if(p!=null)a.push(fmt(p)+" g de proteína");return a.join(" · ")}
function nTxt(n){return Math.round(n).toLocaleString("pt-BR")}

/* ---------- dieta: diário ---------- */
function dWeekStrip(){
  var ws=monday(dsel),h='<div class="week"><button class="nav" data-act="d-wk" data-d="-7" aria-label="Semana anterior">‹</button><div class="days">';
  DIAS.forEach(function(d,i){
    var dt=addDays(ws,i),x=ddias[dt],p=dPlanDia(dt),cls="day",m="",lab="sem plano";
    if(x&&dTocado(x)){cls+=" done";m="✓";lab="registrado"}
    else if(p&&p.refs.length){m="○";lab="planejado"}
    else cls+=" rest";
    if(dt===hoje)cls+=" today";
    h+='<button class="'+cls+'" data-act="d-day" data-d="'+dt+'" aria-pressed="'+(dt===dsel)+'" aria-label="'+d.n+" "+parse(dt).getDate()+", "+lab+'"><span class="a">'+d.c+'</span><span class="n">'+parse(dt).getDate()+'</span><span class="m">'+m+'</span></button>';
  });
  return h+'</div><button class="nav" data-act="d-wk" data-d="7" aria-label="Próxima semana">›</button></div>';
}
function dResumo(d){
  var t=dDiaTot(d),pk=d.metaKcal?Math.min(100,Math.round(t.kcal/d.metaKcal*100)):0,pp=d.metaProt?Math.min(100,Math.round(t.prot/d.metaProt*100)):0;
  return'<div class="stats"><div class="stat"><b>'+nTxt(t.kcal)+'</b><span>kcal'+(d.metaKcal?" de "+nTxt(d.metaKcal):"")+'</span>'+(d.metaKcal?'<span class="hbar"><b style="width:'+pk+'%"></b></span>':"")+'</div>'+
    '<div class="stat"><b>'+nTxt(t.prot)+' g</b><span>proteína'+(d.metaProt?" de "+nTxt(d.metaProt)+" g":"")+'</span>'+(d.metaProt?'<span class="hbar"><b style="width:'+pp+'%"></b></span>':"")+'</div>'+
    '<div class="stat"><b>'+(t.itTot?t.itOk+"/"+t.itTot:"–")+'</b><span>itens do plano comidos</span></div>'+
    '<div class="stat"><b>'+(d.metaKcal?nTxt(Math.max(0,d.metaKcal-t.kcal)):"–")+'</b><span>kcal que faltam</span></div></div>';
}
var SAC=[["fome","Com fome"],["ok","Ok"],["cheio","Cheio"]];
function dRefCard(r,i){
  var t=dRefTot(r),n=r.itens.length,ok=r.itens.filter(function(x){return x.st==="ok"}).length,nao=r.itens.filter(function(x){return x.st==="nao"}).length;
  var cls=!t.reg?"":(n&&ok===n)||(!n&&t.inf)?" s-ok":n&&nao===n&&!t.inf?" s-nao":" s-parcial",at=' data-i="'+i+'"';
  var h='<article class="ex'+cls+'"><div class="ex-h">';
  if(r.extra)h+='<label class="f" style="flex:1"><span>Refeição fora do plano</span><input type="text" id="dr-'+r.id+'-nome" data-dd="ref" data-f="nome"'+at+' value="'+esc(r.nome)+'" placeholder="ex.: Sobremesa, lanche da padaria"></label><label class="f" style="width:104px"><span>Hora</span><input type="time" id="dr-'+r.id+'-hora" data-dd="ref" data-f="hora"'+at+' value="'+esc(r.hora)+'"></label><button class="x" data-act="d-rdel"'+at+' aria-label="Remover refeição">×</button>';
  else h+='<h3>'+esc(r.nome||"Refeição")+(r.hora?' <small class="hr">'+esc(r.hora)+'</small>':"")+'</h3><span class="plan">'+esc(dRefTxt(r.kcalP,r.protP))+'</span>'+(r.opc?'<span class="chip warn">Opcional</span>':"");
  h+='</div>';
  if(r.nota)h+='<p class="nota"><b>Orientação</b>'+esc(r.nota)+'</p>';
  if(n){
    h+='<div class="sets">';
    r.itens.forEach(function(x,j){h+='<div class="it'+(x.st==="ok"?" on":x.st==="nao"?" off":"")+'"><span class="it-t">'+esc(x.txt)+'</span><button class="ck2 ok" data-act="d-it"'+at+' data-j="'+j+'" data-v="ok" aria-pressed="'+(x.st==="ok")+'">Comi</button><button class="ck2 nao" data-act="d-it"'+at+' data-j="'+j+'" data-v="nao" aria-pressed="'+(x.st==="nao")+'">Não comi</button></div>'});
    h+='</div>';
    if(n>1)h+='<div class="acts"><button class="btn sm" data-act="d-all"'+at+'>Comi tudo</button></div>';
  }
  h+='<label class="f"><span>'+(r.extra?"O que comi e quanto":"O que comi no lugar ou a mais (o que foi e a quantidade)")+'</span><textarea class="mini" id="dr-'+r.id+'-obs" data-dd="ref" data-f="obs"'+at+' placeholder="'+(r.extra?"ex.: meia barra de chocolate, 1 pão na chapa com requeijão":"ex.: no lugar do frango, 3 ovos mexidos; comi só metade do arroz")+'">'+esc(r.obs)+'</textarea></label>';
  h+='<div class="blk"><span class="lbl">Saciedade depois de comer</span><div class="seg">'+SAC.map(function(o){return'<button class="per" data-act="d-sac"'+at+' data-v="'+o[0]+'" aria-pressed="'+(r.sac===o[0])+'">'+o[1]+'</button>'}).join("")+'</div></div>';
  var busy=dRegBusy===r.id,velho=t.inf&&r.sig!=null&&r.sig!==dSig(r);
  if(t.inf)h+='<div class="reg"><span class="chip good">Registrada</span><b>~'+nTxt(r.kcal)+' kcal · '+fmt(r.prot||0)+' g de proteína'+(r.carb!=null?" · "+fmt(r.carb)+" g de carboidrato":"")+(r.gord!=null?" · "+fmt(r.gord)+" g de gordura":"")+'</b>'+(r.calc?'<span class="hint">'+esc(r.calc)+'</span>':"")+'</div>';
  if(velho)h+='<p class="hint" style="color:var(--warn)">Você mudou esta refeição depois do registro. Toque em “Calcular de novo” para atualizar.</p>';
  if(dRegErr&&dRegErr.id===r.id)h+='<p class="hint" style="color:var(--bad)">'+esc(dRegErr.msg)+'</p>';
  h+='<div class="acts">'+(busy?'<button class="btn pri" disabled>Calculando…</button><button class="btn sm" data-act="d-regstop">Parar</button>':'<button class="btn '+(t.inf&&!velho?"":"pri")+'" data-act="d-reg"'+at+'>'+(t.inf?"Calcular de novo":"Registrar refeição")+'</button>')+(t.inf&&!busy?'<button class="btn ghost sm" data-act="d-unreg"'+at+'>Desfazer registro</button>':"")+'</div>';
  if(!t.inf)h+='<p class="hint">'+(t.reg?"Prévia pelo plano: ~"+nTxt(t.kcal)+" kcal · "+nTxt(t.prot)+" g de proteína. Toque em “Registrar refeição” para calcular com o que você comeu de fato.":(r.extra?"Descreva o que comeu e toque em “Registrar refeição”; o app calcula as calorias e a proteína.":"Marque os itens, descreva o que mudou se for o caso e toque em “Registrar refeição”."))+'</p>';
  h+='</article>';
  return h;
}
function renderDDia(){
  if(!dsel)dsel=hoje;
  var d=dView(dsel),real=!!ddias[dsel],temSem=!!dsem[monday(dsel)];
  var h=dWeekStrip()+'<div class="head"><p class="eyebrow">'+esc(longDate(dsel))+(dsel===hoje?" · hoje":"")+'</p><h2>Diário alimentar</h2></div>';
  h+=dResumo(d);
  h+='<div class="row2"><label class="f"><span>Peso em jejum (kg)</span><input class="num" type="text" inputmode="decimal" id="dd-peso" data-dd="dia" data-f="peso" value="'+(d.peso!=null?fmt(d.peso):"")+'" placeholder="ex.: 99,4"></label><div class="f"><span>Meta do dia</span><p class="hint" style="padding-top:9px">'+(d.metaKcal||d.metaProt?esc(dRefTxt(d.metaKcal,d.metaProt)):"Sem meta definida no plano")+'</p></div></div>';
  if(!d.refs.length)h+='<div class="empty"><p>'+(temSem?"Nenhuma refeição planejada para este dia.":"Ainda não há plano alimentar salvo para esta semana. Monte na aba Plano e toque em “Salvar plano da semana”; as refeições aparecem aqui para você marcar o que comeu.")+' Você também pode registrar refeições fora do plano.</p><div class="acts">'+(temSem?"":'<button class="btn pri" data-act="d-goplan">Planejar esta semana</button>')+'</div></div>';
  else h+='<div class="list">'+d.refs.map(dRefCard).join("")+'</div>';
  h+='<div class="acts"><button class="btn" data-act="d-radd">+ Refeição fora do plano</button></div>';
  h+='<div class="panel"><label class="f"><span>Anotações do dia</span><textarea id="dd-notas" data-dd="dia" data-f="notas" placeholder="Fome ao longo do dia, disposição no treino, o que atrapalhou…">'+esc(d.notas)+'</textarea></label>';
  var pend=d.refs.filter(function(r){return!r.opc&&!dRefTot(r).inf}).length;
  if(!d.concluido&&d.refs.length&&pend)h+='<p class="hint">Antes de concluir: '+pend+(pend===1?" refeição ainda sem “Registrar refeição”.":" refeições ainda sem “Registrar refeição”.")+' Elas entram no feedback pela prévia do plano.</p>';
  if(d.refs.length||real)h+='<div class="acts"><button class="btn big '+(d.concluido?"":"pri")+'" data-act="d-done">'+(d.concluido?"Reabrir o dia":"Concluir o dia")+'</button>'+(d.concluido?'<span class="chip good">Dia concluído</span>':"")+'</div>';
  if(real)h+='<div class="acts">'+(dReset?'<span class="hint">Apagar tudo o que foi registrado neste dia?</span><button class="btn danger" data-act="d-reset2">Apagar</button><button class="btn ghost" data-act="d-reset0">Cancelar</button>':'<button class="btn ghost" data-act="d-reset1">Apagar registro do dia</button>')+'</div>';
  h+='</div>'+renderDFeedback(d)+renderDChat(d);
  return h;
}

/* ---------- dieta: registrar refeição (calcula sozinho) ---------- */
var dRegBusy=null, dRegCtl=null, dRegErr=null;
function dSig(r){return r.itens.map(function(x){return x.st||"-"}).join("")+"|"+(r.obs||"").trim()}
function dFixa(date,r,v){
  var n1=function(x){x=Number(x);return isFinite(x)&&x>=0?Math.round(x*10)/10:null};
  r.kcal=Math.round(Number(v.kcal)||0);r.prot=n1(v.prot)||0;r.carb=n1(v.carb);r.gord=n1(v.gord);
  r.calc=String(v.resumo||"").slice(0,400);r.sig=dSig(r);dSave(date);
}
function dRegistrar(i){
  if(dRegBusy)return;
  var date=dsel,d=dEnsure(date),r=d.refs[i],n=r.itens.length,obs=(r.obs||"").trim();
  var ok=r.itens.filter(function(x){return x.st==="ok"}).length,nao=r.itens.filter(function(x){return x.st==="nao"}).length;
  dRegErr=null;
  if(!obs&&!ok&&!nao){dRegErr={id:r.id,msg:r.extra||!n?"Descreva o que você comeu e a quantidade antes de registrar.":"Marque os itens que comeu ou descreva o que comeu no lugar antes de registrar."};return}
  if(!obs&&n&&ok===n&&r.kcalP!=null){dFixa(date,r,{kcal:r.kcalP,prot:r.protP||0,resumo:"Tudo conforme o plano; usei os valores planejados."});return}
  if(!obs&&n&&nao===n){dFixa(date,r,{kcal:0,prot:0,carb:0,gord:0,resumo:"Refeição não feita."});return}
  if(!sampleFn||coachOff){
    if(!obs&&n&&r.kcalP!=null){dFixa(date,r,{kcal:r.kcalP*ok/n,prot:(r.protP||0)*ok/n,resumo:"Sem o cálculo automático agora; usei o plano na proporção dos itens comidos."});return}
    dRegErr={id:r.id,msg:"O cálculo automático não está disponível agora. Verifique a conexão e tente de novo."};return;
  }
  var itens=r.itens.map(function(x){return"- "+x.txt+" → "+(x.st==="ok"?"COMEU":x.st==="nao"?"NÃO COMEU":"sem marcação (considere que não comeu)")}).join("\n");
  var prompt="Calcule as calorias e os macros de UMA refeição que o usuário acabou de registrar no aplicativo de dieta dele.\n\n"+
    "REFEIÇÃO: "+(r.nome||"Refeição fora do plano")+(r.hora?" ("+r.hora+")":"")+"\n"+
    (r.extra?"Esta refeição não estava no plano.\n":"PLANO DESTA REFEIÇÃO: "+(dRefTxt(r.kcalP,r.protP)||"sem valores definidos")+(r.nota?"\nOrientação do plano: "+r.nota:"")+"\nITENS DO PLANO E O QUE ELE MARCOU:\n"+(itens||"(sem itens)")+"\n")+
    "O QUE ELE DESCREVEU (o que comeu no lugar ou a mais, com as quantidades): "+(obs||"(nada descrito)")+"\n\n"+
    "REGRAS: some os itens marcados como COMEU, usando as quantidades do plano; não some os marcados como NÃO COMEU nem os sem marcação; some tudo o que ele descreveu. Se a descrição disser que um item foi comido em parte ou trocado, siga a descrição. Use valores de alimento pronto e as referências de porção do perfil abaixo quando o alimento aparecer lá. Se todos os itens foram comidos e nada foi descrito, devolva os valores do plano. Quando faltar quantidade, assuma uma porção comum e diga isso no resumo.\n\n"+
    "PERFIL DO USUÁRIO (inclui porções já calibradas):\n"+(perfil.texto.trim().slice(-9000)||"(vazio)")+"\n\n"+
    'Responda APENAS com um objeto JSON neste formato, sem texto antes ou depois: {"kcal": número, "prot": número, "carb": número, "gord": número, "resumo": "uma frase curta em português dizendo o que foi considerado e qual é a maior incerteza"}';
  dRegBusy=r.id;dRegCtl=new AbortController();
  var achar=function(){var dd=ddias[date];return dd?dd.refs.filter(function(x){return x.id===r.id})[0]:null};
  var fim=function(){dRegBusy=null;dRegCtl=null;maybeRender()};
  var p=sampleFn.json?sampleFn.json(prompt,{signal:dRegCtl.signal,modelTier:"quick"}):sampleFn(prompt,{signal:dRegCtl.signal}).then(function(x){var m=/\{[\s\S]*\}/.exec(x.text);return JSON.parse(m?m[0]:x.text)});
  p.then(function(v){
    var alvo=achar();
    if(!alvo||!v||!isFinite(Number(v.kcal)))dRegErr={id:r.id,msg:"Não consegui calcular esta refeição. Descreva com mais detalhe e tente de novo."};
    else dFixa(date,alvo,v);
    fim();
  },function(e){
    var c=(e&&e.code)||"upstream_error";
    if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled")coachOff=true;
    if(c!=="cancelled")dRegErr={id:r.id,msg:c==="invalid_json"?"Não consegui calcular esta refeição. Descreva com mais detalhe e tente de novo.":(COACH_ERRO[c]||"O cálculo falhou no caminho. Toque em “Registrar refeição” para tentar de novo.")};
    fim();
  });
}

/* ---------- dieta: feedback ao concluir o dia ---------- */
var dfBusy=null, dfLive="", dfErr="", dfCtl=null;
var DF_REGRAS="Você é o coach de alimentação do usuário, dentro do aplicativo dele. Ele acabou de concluir o dia descrito em DIÁRIO DO DIA. Escreva um feedback rápido desse dia, em português do Brasil e em texto puro (sem markdown, sem asteriscos, sem tabelas), com no máximo cerca de 150 palavras, neste formato:\n- uma frase de abertura com o total do dia (calorias e proteína) em relação à meta e a leitura geral;\n- depois, uma linha para cada refeição que mereça comentário, começando com o nome da refeição e dois-pontos, dizendo o que foi bem ou o que pesou (troca, excesso, proteína baixa, refeição pulada, saciedade). Comente só o que for útil; não repita refeições que saíram como planejado sem novidade;\n- uma linha final começando com \"Para amanhã:\" com um ou dois ajustes concretos.\nCompare com o plano do dia e com os dias anteriores, e leve em conta o treino do dia, o sono e as preferências do perfil. Refeições marcadas como \"pelo plano\" ainda não foram registradas de fato; diga isso em poucas palavras se mudarem a conclusão. Use só os dados abaixo; quando faltar registro, diga em vez de supor. Você não é médico nem nutricionista.";
function renderDFeedback(d){
  var busy=dfBusy===d.data;
  if(!busy&&!d.feedback&&(!d.concluido||!sampleFn||coachOff))return"";
  var h='<div class="panel" id="dfb"><p class="eyebrow">Feedback do dia</p>';
  if(busy)h+='<div class="fb" id="dfb-live">'+esc(dfLive||"Avaliando o dia…")+'</div><div class="acts"><button class="btn sm" data-act="d-fbstop">Parar</button></div>';
  else{
    if(d.feedback)h+='<div class="fb">'+esc(d.feedback)+'</div>';
    if(dfErr)h+='<p class="hint" style="color:var(--bad)">'+esc(dfErr)+'</p>';
    if(sampleFn&&!coachOff)h+='<div class="acts"><button class="btn sm" data-act="d-fbgen">'+(d.feedback?"Gerar de novo":"Gerar feedback do dia")+'</button>'+(d.feedback?'<span class="hint">Registrou mais alguma coisa? Gere de novo para atualizar.</span>':"")+'</div>';
  }
  return h+'</div>';
}
function dGerarFb(date){
  if(dfBusy||!sampleFn||coachOff||!ddias[date])return;
  dfBusy=date;dfLive="";dfErr="";dfCtl=new AbortController();
  function fim(t){dfBusy=null;dfLive="";dfCtl=null;var x=ddias[date];if(t&&x){x.feedback=t;dSave(date)}maybeRender()}
  sampleFn(DF_REGRAS+"\n\n"+dContexto(date),{cache:false,signal:dfCtl.signal,onText:function(u){dfLive=u.text;var el=document.getElementById("dfb-live");if(el)el.textContent=u.text}}).then(function(r){
    fim(r.text+(r.truncated?"\n(texto cortado pelo limite de tamanho)":""));
  },function(e){
    var c=(e&&e.code)||"upstream_error";
    if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed")coachOff=true;
    else if(c!=="cancelled")dfErr=COACH_ERRO[c]||"O feedback falhou no caminho. Toque em “Gerar feedback do dia” para tentar de novo.";
    fim(null);
  });
}

/* ---------- dieta: conversa com fotos ---------- */
function renderDChat(d){
  var h='<div class="panel" id="dchat"><div class="blk"><p class="eyebrow">Fale com o coach de dieta</p>';
  if(coachOff||!sampleFn)return h+'<p class="hint">'+(coachOff?"O coach não está disponível nesta conta ou nesta visualização.":"O coach não está disponível agora. Verifique a conexão e entre de novo.")+'</p></div></div>';
  var chat=d.chat||[];
  h+='<p class="hint">Peça dicas, uma troca pontual ou mande a descrição ou a foto de uma refeição para ele estimar calorias e proteína. Ele lê o plano da semana, o que você marcou hoje, os últimos dias, o treino, o sono e o seu perfil.</p></div>';
  if(chat.length||dBusy){
    h+='<div class="chat">'+chat.map(function(m){return'<div class="msg '+(m.r==="u"?"u":"a")+'">'+esc(m.t)+'</div>'}).join("");
    if(dBusy)h+='<div class="msg a" id="dchat-live">'+esc(dLive||"Pensando…")+'</div>';
    h+='</div>';
  }
  if(dErr)h+='<p class="hint" style="color:var(--bad)">'+esc(dErr)+'</p>';
  h+='<label class="f"><span>Sua mensagem</span><textarea class="mini" id="dchat-in" data-dd="chat" placeholder="ex.: acabou o frango, o que coloco no lanche? · Segue foto do jantar: 150 g de arroz e o que aparece no prato">'+esc(dDraft)+'</textarea></label>';
  h+='<div class="acts">'+(dBusy?'<button class="btn" data-act="d-stop">Parar resposta</button>':'<button class="btn pri" data-act="d-send">Enviar</button>');
  if(dFotoOk&&!dBusy)h+='<label class="btn" for="dchat-foto">'+(dFotos.length?"Trocar fotos":"Adicionar foto")+'</label><input type="file" id="dchat-foto" accept="image/jpeg,image/png,image/webp,image/gif" multiple data-dd="foto" hidden>'+(dFotos.length?'<span class="chip good">'+dFotos.length+(dFotos.length>1?" fotos anexadas":" foto anexada")+'</span><button class="btn ghost sm" data-act="d-fotoclr">Remover</button>':"");
  if(chat.length&&!dBusy)h+='<button class="btn ghost sm" data-act="d-clr">Limpar conversa</button>';
  h+='</div>';
  if(!dFotoOk)h+='<p class="hint">Nesta visualização o envio de fotos não está disponível; descreva a refeição em texto.</p>';
  else h+='<p class="hint">Na foto, ajuda ter algo de referência ao lado (a mão, um garfo, o celular) e dizer o que já foi pesado. As fotos vão para o Claude só para essa resposta e não ficam guardadas.</p>';
  return h+'</div>';
}
function dRefLinha(r){
  var t=dRefTot(r),its=r.itens.map(function(x){return x.txt+(x.st==="ok"?" [comeu]":x.st==="nao"?" [não comeu]":" [sem marcação]")}).join("; ");
  return"- "+(r.hora?r.hora+" ":"")+(r.nome||"Refeição")+(r.extra?" (fora do plano)":r.opc?" (opcional)":"")+(r.kcalP!=null||r.protP!=null?" | plano: "+dRefTxt(r.kcalP,r.protP):"")+(its?" | itens: "+its:"")+(r.obs?" | relato: "+r.obs:"")+(t.reg?" | contou: ~"+t.kcal+" kcal, "+t.prot+" g P"+(t.inf?" (informado)":" (pelo plano)"):" | sem registro")+(r.sac?" | saciedade: "+r.sac:"");
}
function dContexto(date){
  var d=dView(date),t=dDiaTot(d),L=[];
  L.push("HOJE: "+longDate(hoje)+". DIA ABERTO NA TELA: "+longDate(date)+".");
  L.push("\nPERFIL DO USUÁRIO (escrito por ele na aba Perfil):\n"+(perfil.texto.trim().slice(0,20000)||"(nada preenchido)"));
  var w=dsem[monday(date)];
  if(w)L.push("\nPLANO ALIMENTAR DA SEMANA:\n"+DIAS.map(function(x){var p=w.dias[x.k];return x.n+(p.metaKcal||p.metaProt?" (meta "+dRefTxt(p.metaKcal,p.metaProt)+")":"")+":\n"+(p.refs.length?p.refs.map(function(r){return"  - "+(r.hora?r.hora+" ":"")+r.nome+(r.opc?" (opcional)":"")+" | "+dRefTxt(r.kcal,r.prot)+" | "+r.itens.replace(/\n/g,"; ")+(r.nota?" | orientação: "+r.nota.replace(/\n/g," "):"")}).join("\n"):"  (sem refeições)")}).join("\n"));
  else L.push("\nPLANO ALIMENTAR DA SEMANA: nenhum plano salvo para esta semana.");

var D_REGRAS="Você é o coach de alimentação do usuário, dentro do aplicativo dele de treino e dieta. Responda em português do Brasil, em texto simples (sem markdown, sem tabelas, sem asteriscos), curto e direto, começando pela resposta. Quando ele descrever ou mandar foto de uma refeição, estime item por item e dê o total no formato \"~kcal | g P | g C | g G\", usando valores de alimento pronto; diga qual item traz mais incerteza e o que ele pode informar (peso, modo de preparo, óleo) para melhorar a estimativa; depois diga em uma linha como isso deixa o dia em relação à meta e ao que falta. Se a foto não permitir estimar, peça o que falta em vez de inventar. Para dicas e trocas pontuais, dê quantidades em gramas ou medidas caseiras que mantenham calorias e proteína próximas do plano, respeitando as preferências do perfil. Use só os dados abaixo; quando faltar um dado, diga que não tem. Você não é médico nem nutricionista: para sintomas, restrições médicas ou mudanças grandes, oriente procurar um profissional.";
function dEnviar(){
  if(dBusy||!sampleFn)return;
  var date=dsel,d=dEnsure(date),msg=dDraft.trim(),chat=d.chat||[],fotos=dFotos.slice();
  if(!msg&&fotos.length)msg="Veja a foto desta refeição e estime calorias e macros.";
  if(msg){d.chat=chat=chat.concat([{r:"u",t:msg+(fotos.length?"\n["+fotos.length+(fotos.length>1?" fotos enviadas]":" foto enviada]"):"")}]).slice(-40);dSave(date)}
  else if(!chat.length||chat[chat.length-1].r!=="u")return;
  dDraft="";dErr="";dBusy=true;dLive="";dFotos=[];dCtl=new AbortController();
  var turns=[{role:"user",content:D_REGRAS+"\n\n"+dContexto(date)}].concat(chat.slice(-13).map(function(m){return{role:m.r==="u"?"user":"assistant",content:m.t}}));
  var opt={cache:false,signal:dCtl.signal,onText:function(u){dLive=u.text;var el=document.getElementById("dchat-live");if(el)el.textContent=u.text}};
  if(fotos.length)opt.images=fotos;
  function fim(t){
    dBusy=false;dLive="";dCtl=null;
    var dd=ddias[date];if(t&&dd){dd.chat=(dd.chat||[]).concat([{r:"a",t:t}]).slice(-40);dSave(date)}
    render();
  }
  render();
  sampleFn(turns,opt).then(function(r){fim(r.text+(r.truncated?"\n(resposta cortada pelo limite de tamanho)":""))},function(e){
    var c=(e&&e.code)||"upstream_error",t=c==="refused"?"":(e&&e.text)||"";
    if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed")coachOff=true;
    else if(c==="images_unavailable"){dFotoOk=false;dErr="Não foi possível enviar fotos nesta visualização. Descreva a refeição em texto e envie de novo."}
    else if(c==="image_rejected")dErr="A foto não foi aceita (tipo ou tamanho). Tente outra foto ou descreva a refeição.";
    else if(c!=="cancelled")dErr=COACH_ERRO[c]||"A resposta falhou no caminho. Toque em Enviar para tentar de novo.";
    fim(t?t+(c==="cancelled"?"":"\n(resposta interrompida)"):null);
  });
}

  else if(a==="psdel"){var pd=plano.dias[b.dataset.p].ex[i].sets;if(pd.length>1){pd.splice(j,1);touch("plano")}}
  else if(a==="pup"||a==="pdown"){var pe=plano.dias[b.dataset.p].ex,k2=i+(a==="pup"?-1:1);if(k2>=0&&k2<pe.length){var tmp=pe[i];pe[i]=pe[k2];pe[k2]=tmp;touch("plano")}}
  else if(a==="pdel"){plano.dias[b.dataset.p].ex.splice(i,1);touch("plano")}
  else if(a==="imp"){impOpen=true;impBlocks=null}
  else if(a==="impx"){impOpen=false;impText="";impBlocks=null}
  else if(a==="impback")impBlocks=null;
  else if(a==="impler"){var bl=lerLista(impText);impBlocks=bl.length?bl:null}
  else if(a==="impok"){aplicarImport();window.scrollTo(0,0)}
  else if(a==="goplan"){tab="plano";pw=monday(sel);editW=null;window.scrollTo(0,0)}
  else if(a==="pwk"){pw=addDays(pw,+b.dataset.d);editW=null}
  else if(a==="psave"){if(planoTemAlgo()){semanas[pw]={inicio:pw,salvoEm:new Date().toISOString(),dias:clone(plano.dias)};touch("w:"+pw);editW=null;impOpen=false;window.scrollTo(0,0)}}
  else if(a==="pedit"){plano=normPlano({dias:semanas[pw].dias});touch("plano");editW=pw;window.scrollTo(0,0)}
  else if(a==="pcancel"){editW=null;window.scrollTo(0,0)}
  else if(a==="pcopiar"){
    var ta=document.getElementById("pf-pedido"),ok=document.getElementById("pf-copiado");
    var falhou=function(){ta.focus();ta.select();ok.textContent="Não deu para copiar sozinho. O texto está selecionado: copie manualmente."};
    try{navigator.clipboard.writeText(PEDIDO_RESUMO).then(function(){ok.textContent="Pedido copiado."},falhou)}catch(e){falhou()}
    return;
  }
  else if(a==="pcopy"){var src=semanas[b.dataset.k];if(src){plano=normPlano({dias:src.dias});touch("plano");impOpen=false}}
  else if(a==="coach"){coachEnviar();return}
  else if(a==="coachstop"){if(coachCtl)coachCtl.abort();return}
  else if(a==="coachclr"){s=sessoes[sel];if(s&&s.chat){s.chat=[];save(sel)}coachErr=""}

  else if(a==="hper")hPer=b.dataset.v;
  else if(a==="hex"){hEx=b.dataset.k;render();var hs=document.getElementById("h-ex");if(hs)hs.scrollIntoView({block:"center"});return}
  render();
  if(a==="padd"){var rows=app.querySelectorAll('[data-pf="nome"][data-p="'+b.dataset.p+'"]');if(rows.length)rows[rows.length-1].focus()}
});
function pararRelogio(s){if(s.inicio){s.min=Math.max(1,Math.round((Date.now()-s.inicio)/60000));s.inicio=null}}

app.addEventListener("input",function(ev){
  var t=ev.target,d=t.dataset,v=t.value;
  if(d.dd){dInput(t);return}
  if(d.jj){jInput(t);return}
  if(d.sono){var sd=sonoDoc();sd[d.sono]=v;touch("n:"+sonoDia);needsRender=true;var sr=document.getElementById("sono-res");if(sr)sr.textContent=sonoResumo(sd);return}
  if(d.hex){hEx=v;render();return}
  if(d.coach){coachDraft=v;return}
  if(d.plink){perfil.link=v;touch("perfil");var ab=document.getElementById("pf-abrir");if(ab)ab.innerHTML=abrirLink();return}
  if(d.perfil){perfil.texto=v;touch("perfil");var sg=document.getElementById("pf-sug");if(sg)sg.innerHTML=sugPerfil();return}
  if(d.imp){impText=v}
  else if(d.po){plano.dias[d.po].obs=v;touch("plano")}
  else if(d.blk){impBlocks[+d.blk].dia=v}
  else if(d.blkn){impBlocks[+d.blkn].nome=v}
  else if(d.pn){plano.dias[d.pn].nome=v;touch("plano")}
  else if(d.pf){var e=plano.dias[d.p].ex[+d.i];if(d.j!=null)e.sets[+d.j][d.pf]=d.pf==="carga"?num(v):v;else e[d.pf]=v;touch("plano")}
  else if(d.sf){var s=ensure(sel),x=s.ex[+d.i];if(d.sj!=null)x.sets[+d.sj][d.sf]=d.sf==="cargaReal"?num(v):v;else x[d.sf]=v;save(sel);var c=document.getElementById("chip-"+d.i);if(c)c.innerHTML=chip(x)}
  else if(d.ss){var s2=ensure(sel);if(d.ss==="min"){var n=num(v);s2.min=n==null?null:Math.round(n);s2.inicio=null}else s2[d.ss]=v;save(sel)}
});
app.addEventListener("change",function(ev){var t=ev.target;if(t.dataset&&t.dataset.dd==="foto"&&!dFotos.length&&t.files&&t.files.length)dInput(t)});
app.addEventListener("focusout",function(){setTimeout(function(){if(needsRender)maybeRender()},300)});
setInterval(function(){
  var s=sessoes[sel],c=document.getElementById("clock");
  if(tab==="hoje"&&s&&s.inicio&&c)c.textContent=clockTxt(s);
  var h=iso(new Date());if(h!==hoje){if(sel===hoje)sel=h;if(dsel===hoje)dsel=h;hoje=h;maybeRender()}
},1000);
window.addEventListener("pagehide",function(){if(mode==="local"&&dirty.size){dirty.clear();saveLocal()}});

render();
if(window.claude&&window.claude.use)window.claude.use("sample").then(function(fn){if(fn){sampleFn=fn;maybeRender();try{fn.limits().then(function(l){dFotoOk=!!(l&&l.images);maybeRender()},function(){})}catch(e){}}},function(){});
var boot=window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null);
boot.then(function(d){if(d)startDb(d);else{mode="local";flushAll()}},function(){mode="local";flushAll()});
})();
